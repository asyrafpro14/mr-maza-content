<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=p=>1-Math.pow(1-cl(p),3),eio=p=>{p=cl(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2},back=p=>{p=cl(p);const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)},lerp=(a,b,p)=>a+(b-a)*p;
const $=id=>document.getElementById(id);
const GOLD="#E7CE7C",RED="#E0465A",INK="#F4F1E8",MUTE="#9AA6BF";
let TL,P,HITS=[],FL=[],CUTS=[],GL=[];
const S=i=>P[i].start,E=i=>P[i].end,W=(i,j)=>P[i].words[j][1];
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
// partikel letupan
function burst(x,y,t0,t,n,col,spd=420,sz=10,dur=0.9){if(t<t0||t>t0+dur)return"";const p=(t-t0)/dur;let h="";
  for(let i=0;i<n;i++){const a=rnd(i+x)*Math.PI*2,v=spd*(0.4+rnd(i*3+y)*0.8),px=x+Math.cos(a)*v*ease(p),py=y+Math.sin(a)*v*ease(p)+300*p*p;
    h+=`<circle cx="${px}" cy="${py}" r="${sz*(1-p)}" fill="${col}" opacity="${1-p}"/>`}return h}
function ring(x,y,t0,t,col,r1=260,dur=0.6,w=12){if(t<t0||t>t0+dur)return"";const p=(t-t0)/dur;return `<circle cx="${x}" cy="${y}" r="${20+r1*ease(p)}" fill="none" stroke="${col}" stroke-width="${w*(1-p)}" opacity="${1-p}"/>`}
function txt(x,y,s,col,size=50,anchor="middle",op=1){return `<text x="${x}" y="${y}" fill="${col}" font-family="Anton" font-size="${size}" text-anchor="${anchor}" opacity="${op}">${s}</text>`}
function glitch(el,t,hits){let g=0;hits.forEach(h=>{const d=t-h;if(d>=0&&d<0.45)g=Math.max(g,1-d/0.45)});
  const dx=g*(10+14*rnd(Math.floor(t*30)));el.style.textShadow=g>0.02?`${dx}px 0 #ff2a55,${-dx}px 0 #22e1ff`:"none";
  el.style.clipPath=g>0.5&&rnd(Math.floor(t*30)+7)>0.5?`inset(${rnd(Math.floor(t*30))*60}% 0 ${rnd(Math.floor(t*30)+1)*30}% 0)`:"none"}
function shine(el,t,speed=0.5,off=0){const p=((t*speed+off)%1.6)/1.6;el.style.backgroundPosition=`${lerp(140,-40,p)}% 0`}
function show(el,t0,t,mode="up",dur=0.3){const e=typeof el==="string"?$(el):el;if(t<t0){e.style.opacity=0;return}
  if(mode==="pop"){const s=back((t-t0)/0.26);e.style.opacity=cl((t-t0)/0.07);e.style.transform=`scale(${2-s})`}
  else if(mode==="fly"){const p=ease((t-t0)/0.45);e.style.opacity=cl((t-t0)/0.15);e.style.transform=`scale(${lerp(3.2,1,p)})`;e.style.filter=`blur(${(1-p)*14}px)`}
  else{const p=ease((t-t0)/dur);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*60}px)`}}
function scene(id,a,b,t){const e=$(id);let o=0;if(t>=a&&t<b)o=Math.min(ease((t-a)/0.1),ease((b-t)/0.1));e.style.opacity=o;return o>0}
// carta fibo
const YH=110,YL=720,LV=[[.382,"38.2",MUTE],[.5,"50",MUTE],[.618,"61.8",RED],[.786,"78.6",GOLD],[.9,"90",GOLD]];
const fy=r=>YH+r*(YL-YH);
let IMP=[],PB=[];
function poly(pts,t){let d="",head=pts[0];for(let i=0;i<pts.length;i++){const [x,y,tt]=pts[i];if(i===0){d="M"+x+" "+y;continue}const [px,py,pt]=pts[i-1];
  if(t>=tt){d+=` L${x} ${y}`;head=[x,y]}else{if(t>pt){const p=(t-pt)/(tt-pt);head=[lerp(px,x,p),lerp(py,y,p)];d+=` L${head[0]} ${head[1]}`}break}}return{d,head}}
function build(tl){TL=tl;P=tl.p;
  let dh="";for(let i=0;i<46;i++){const s=2+rnd(i)*5;dh+=`<i style="width:${s}px;height:${s}px"></i>`}$("dust").innerHTML=dh;
  const a=S(4),b=E(4);IMP=[[60,720,a],[150,580,lerp(a,b,.2)],[200,640,lerp(a,b,.35)],[300,420,lerp(a,b,.55)],[350,480,lerp(a,b,.68)],[450,190,lerp(a,b,.88)],[520,110,b]];
  PB=[[520,110,S(6)],[565,250,S(6)+0.35],[600,205,S(6)+0.6],[650,400,S(6)+1.0],[690,360,S(6)+1.3],[735,500,E(6)-0.2],[765,465,S(8)],[805,630,W(9,1)],[835,655,S(10)],[870,520,S(10)+0.4],[900,330,E(10)]];
  HITS=[W(0,4),W(1,4),W(1,5),S(2),W(2,2),S(3),W(5,1),W(9,0),S(10),S(12),S(13),S(15),S(16),S(17)+0.35,W(18,2),S(19),S(20),S(21),S(22)];
  FL=[[W(0,4),"#E7CE7C",.35],[W(1,5),"#E0465A",.45],[W(9,0),"#E0465A",.35],[S(10),"#E7CE7C",.3],[S(17)+0.35,"#FFFFFF",.6],[W(18,2),"#E7CE7C",.45],[S(20),"#E0465A",.4]];
  CUTS=[S(2),S(4),S(17)+0.35,S(19),S(21)];
  return tl.total}
function render(t){
  $("prog").firstElementChild.style.width=cl(t/TL.total)*100+"%";
  // persekitaran
  $("floor").style.backgroundPosition=`0 ${t*90}px`;
  document.querySelectorAll("#dust i").forEach((d,i)=>{const sp=10+rnd(i+5)*30;const x=(rnd(i)*1080+Math.sin(t*0.5+i)*30)%1080,y=((rnd(i+9)*1920-t*sp)%1920+1920)%1920;d.style.transform=`translate(${x}px,${y}px)`;d.style.opacity=0.25+0.5*rnd(i+2)*(0.6+0.4*Math.sin(t*2+i))});
  // kamera: punch, gegar, whip
  let punch=0,shake=0;HITS.forEach(h=>{const d=t-h;if(d>=0&&d<0.35){punch=Math.max(punch,(1-d/0.35)*0.06);shake=Math.max(shake,(1-d/0.28)*16)}});
  let blur=0,whip=0;CUTS.forEach(c=>{const d=t-c;if(Math.abs(d)<0.14){const q=1-Math.abs(d)/0.14;blur=Math.max(blur,q*16);whip=d<0?-q*160:q*160}});
  const cam=$("cam");cam.style.transform=`translate(${shake*Math.sin(t*90)+whip}px,${shake*Math.cos(t*77)}px) scale(${1+punch+0.01*Math.sin(t*0.7)})`;cam.style.filter=blur>0.5?`blur(${blur}px)`:"none";
  let fo=0,fc="#E0465A";FL.forEach(([a,c,g])=>{const d=t-a;if(d>=0&&d<0.4&&(1-d/0.4)*g>fo){fo=(1-d/0.4)*g;fc=c}});$("flash").style.opacity=fo;$("flash").style.background=fc;
  // jalur cahaya diagonal semasa potongan
  let bh="";CUTS.forEach(c=>{const d=t-c;if(d>-0.15&&d<0.25){const p=(d+0.15)/0.4;const x=lerp(-600,1700,ease(p));bh+=`<polygon points="${x},0 ${x+140},0 ${x-560},1920 ${x-700},1920" fill="${GOLD}" opacity="${0.55*(1-Math.abs(p-0.5)*2)}"/>`}});$("bars").innerHTML=bh;
  // ===== HOOK
  if(scene("hook",0,S(2)-0.02,t)){
    const ws=P[0].words.slice(0,4);$("hw").innerHTML=ws.map(([w,a])=>{if(t<a)return"";const s=back((t-a)/0.2);return `<span class="word" style="transform:scale(${1.6-0.6*s});opacity:${cl((t-a)/0.06)}">${w}</span>`}).join("");
    const h=$("h61");show(h,W(0,4),t,"pop");shine(h,t,0.9);glitch(h,t,[W(0,4),W(1,5)]);
    if(t>=S(1)){const p=ease((t-S(1))/0.35);h.style.transform=`translateY(${-p*150}px) scale(${1-0.35*p})`;$("hw").style.opacity=1-p}else $("hw").style.opacity=1;
    // tag SL dan tetakan ekor
    let sv="";const cut=W(1,5);
    for(let i=0;i<7;i++){const x=150+i*130,y=1000+(i%2)*40,a=S(1)+0.1+i*0.07;if(t<a)continue;
      if(t<cut){const s=back((t-a)/0.2);sv+=`<g transform="translate(${x} ${y}) scale(${2-s})"><rect x="-52" y="-34" width="104" height="68" rx="14" fill="rgba(224,70,90,.18)" stroke="${RED}" stroke-width="5"/>${txt(0,20,"SL",RED,52)}</g>`}
      else sv+=burst(x,y,cut+i*0.03,t,10,RED,360,9,0.8)}
    if(t>=cut-0.2&&t<cut+0.5){const p=ease((t-(cut-0.2))/0.25),o=1-cl((t-cut)/0.5);sv+=`<line x1="${lerp(60,1020,p)}" y1="${lerp(870,1150,p)}" x2="60" y2="870" stroke="#fff" stroke-width="${10*o}" opacity="${o}" stroke-linecap="round"/>`}
    sv+=ring(540,1010,cut,t,RED,500,0.7,16);$("hsvg").innerHTML=sv;
    const sl=$("hsl");show(sl,W(1,4),t,"pop");glitch(sl,t,[W(1,4),cut]);}
  // ===== ZON
  if(scene("zon",S(2)-0.02,S(4)-0.02,t)){show("z1",S(2),t,"pop");const z2=$("z2");show(z2,W(2,2),t,"fly");shine(z2,t,0.8);
    const zb=$("zb");const q=ease((t-W(2,2))/0.5);zb.style.opacity=q;zb.style.transform=`scaleX(${q})`;zb.style.boxShadow=`0 0 ${40+30*Math.sin(t*6)}px rgba(231,206,124,.6)`;
    show("z3",S(3),t,"pop");$("z3").querySelector(".sw").style.left=`${lerp(-30,130,cl((t-S(3)-0.2)/0.6))}%`;}
  // ===== FIBO 3D
  if(scene("fib",S(4)-0.02,S(17)+0.35,t)){show("ftag",S(4),t);
    // kamera 3D: condong + orbit, zoom ke zon semasa p11-p15, menjunam masuk pada p17
    const zin=eio((t-S(11))/1.2)*(1-eio((t-S(16))/0.6)),dive=eio((t-S(17))/0.35);
    const sc=1.12+0.5*zin+6*dive,ty=-90*zin-420*dive,ry=Math.sin(t*0.45)*7*(1-zin),rx=16*(1-zin)+4;
    $("plane").style.transform=`perspective(1500px) translateY(${ty}px) scale(${sc}) rotateX(${rx}deg) rotateY(${ry}deg)`;
    $("plane").style.filter=dive>0.05?`blur(${dive*20}px)`:"none";
    let h=`<defs><linearGradient id="zg" x1="0" x2="1"><stop offset="0" stop-color="${GOLD}" stop-opacity=".05"/><stop offset=".5" stop-color="${GOLD}" stop-opacity=".65"/><stop offset="1" stop-color="${GOLD}" stop-opacity=".05"/></linearGradient><filter id="gw"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    // zon 78.6-90
    const zv=ease((t-S(11))/0.5);if(zv>0){const pulse=0.7+0.3*Math.sin(t*7);h+=`<rect x="0" y="${fy(.786)}" width="${900*zv}" height="${fy(.9)-fy(.786)}" fill="url(#zg)" opacity="${pulse}"/>`}
    // tool fibo
    const da=W(5,1),db=E(5);
    if(t>=da){const p=eio((t-da)/(db-da-0.3));const x2=lerp(60,520,p),y2=lerp(YL,YH,p);
      h+=`<line x1="60" y1="${YL}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="4" stroke-dasharray="14 10" opacity=".8"/>`;
